<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe – Sharhan Broilers</title>
<style>
  body { margin: 0; background: #f4f1ea; font-family: Arial, Helvetica, sans-serif; color: #1c1b19; }
  main { max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .box { background: #fff; border-radius: 6px; overflow: hidden; }
  .head { background: #1c1b19; color: #fff; padding: 18px 20px; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
  .body { padding: 20px; font-size: 16px; line-height: 1.5; }
  a { color: #846e3e; font-weight: bold; }
  button { margin-top: 4px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 4px; background: #846e3e; color: #fff;
    font: bold 15px Arial, Helvetica, sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="head">SHARHAN BROILERS</div>
    <div class="body"><p id="msg">One moment…</p><p id="again" hidden><button type="button" id="again-btn">Subscribe again</button></p><p><a href="/">Go to our website</a></p></div>
  </div>
</main>
<script>
// Catalogue emails link here (our own address, not the Worker's); the Worker checks the signed link.
(function () {
  var p = new URLSearchParams(location.search), msg = document.getElementById('msg');
  var e = p.get('e') || '', t = p.get('t') || '';
  if (!e || !t) { msg.textContent = "This link isn't complete."; return; }
  var url = 'https://sharhan-whatsapp.waseemshaikh597.workers.dev/email-unsub?json=1&e=' + encodeURIComponent(e) + '&t=' + encodeURIComponent(t);
  var again = document.getElementById('again'), btn = document.getElementById('again-btn');
  var oops = function () { msg.textContent = "Couldn't reach us just now. Please try the link again in a minute."; };
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    msg.textContent = d.ok ? "Done. You won't get our catalogue emails any more." : "This link isn't valid.";
    again.hidden = !d.ok; // unsubscribed by mistake? one tap undoes it
  }).catch(oops);
  btn.addEventListener('click', function () {
    btn.disabled = true;
    fetch(url + '&undo=1').then(function (r) { return r.json(); }).then(function (d) {
      msg.textContent = d.ok ? "Done. You'll get our catalogue emails again." : "This link isn't valid.";
      again.hidden = true;
    }).catch(function () { btn.disabled = false; oops(); });
  });
})();
</script>
</body>
</html>
